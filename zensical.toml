[project]
site_name = "multi-dap"
site_description = "A CLion-first local Debug Adapter Protocol backend for Green Hills MULTI"
docs_dir = "docs"
site_dir = "site"
strict = true
use_directory_urls = true

nav = [
  { "Home" = "index.md" },
  { "Get started" = "getting-started.md" },
  { "Configure CLion" = "clion.md" },
  { "Project configuration" = "configuration.md" },
  { "Architecture" = "architecture.md" },
  { "Capabilities and status" = "capabilities.md" },
  { "Operations" = "operations.md" },
  { "Development" = "development.md" },
  { "Windows distribution" = "distribution.md" },
  { "Verification evidence" = "verification-evidence.md" },
  { "Release" = "releasing.md" },
  { "Security" = "security.md" },
  { "GitHub configuration" = "github-configuration.md" },
  { "Integration evidence" = [
    { "M0 hardware findings" = "m0-findings.md" },
    { "MULTI API notes" = "multi-api-notes.md" },
    { "Windows packaging and editors" = "m6-packaging-and-editors.md" },
  ] },
  { "Historical plans" = [
    { "M0 closure and M1 implementation" = "superpowers/plans/2026-08-18-m0-closure-and-m1-implementation.md" },
    { "M0 reconnaissance and M1 skeleton" = "superpowers/plans/2026-08-18-m0-recon-and-m1-skeleton.md" },
  ] },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
variant = "modern"
language = "en"
font = false
features = [
  "content.code.copy",
  "content.code.select",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
