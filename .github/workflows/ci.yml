name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l .)
          if ($unformatted.Count -ne 0) {
            $unformatted
            throw 'Go files are not formatted.'
          }
      - name: Run unit and integration tests
        run: go test -mod=readonly -count=1 ./...
      - name: Run vet
        run: go vet -mod=readonly ./...
      - name: Run race tests
        run: go test -mod=readonly -race ./...
      - name: Compile all commands
        run: go build -mod=readonly -trimpath -buildvcs=false ./...

  python-host:
    name: Python host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          enable-cache: false
      - name: Install host-test Python
        run: uv python install 3.12
      - name: Test the MULTI bridge and native trace helper host surface
        run: uv run --no-project --no-python-downloads --python 3.12 -m unittest bridge.test_bridge bridge.test_timemachine_native bridge.test_timemachine_helper
      - name: Test the reconnaissance host surface
        run: uv run --no-project --no-python-downloads --python 3.12 -m unittest discover -s recon/tests
      - name: Test wheel packaging and launcher
        run: uv run --no-project --no-python-downloads --python 3.12 -m unittest discover -s packaging/python/tests

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm test
      - run: npm run lint
      - run: npm run package-contents

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          enable-cache: false
      - name: Build strict documentation
        run: uv run --project docs --locked --python 3.12 zensical build --clean --strict
      - name: Test repository policy validators
        run: >-
          uv run --offline --no-python-downloads --no-project --python 3.12
          -m unittest tools.test_validate_repository_language
          tools.test_validate_release_changelog
      - name: Enforce English repository text
        run: >-
          uv run --offline --no-python-downloads --no-project --python 3.12
          -m tools.validate_repository_language --repository .

  zed:
    name: Zed source extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and Wasm target
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-wasip2
      - name: Check formatting
        run: cargo +1.95.0 fmt --manifest-path editors/zed/Cargo.toml --check
      - name: Test the registered adapter contract
        run: cargo +1.95.0 test --locked --manifest-path editors/zed/Cargo.toml
      - name: Lint the extension
        run: cargo +1.95.0 clippy --locked --manifest-path editors/zed/Cargo.toml --all-targets -- -D warnings
      - name: Build the Wasm extension
        run: cargo +1.95.0 build --locked --release --target wasm32-wasip2 --manifest-path editors/zed/Cargo.toml

  go-vulnerability-audit:
    name: Go vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan Go dependencies and call paths for known vulnerabilities
        run: go run -mod=readonly golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  workflow-policy:
    name: GitHub Actions policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint GitHub Actions workflows
        run: go run -mod=readonly github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  wheel:
    name: Windows uv wheel
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      WHEEL_VERSION: 0.0.0-ci.${{ github.run_number }}
      WHEEL_COMMIT: ${{ github.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          enable-cache: false
      - name: Prepare offline wheel dependencies
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { throw 'Go dependency preparation failed.' }
          uv python install 3.10 3.12
          if ($LASTEXITCODE -ne 0) { throw 'Python preparation failed.' }
      - name: Test launcher and backend on minimum supported Python
        run: uv run --offline --no-python-downloads --no-project --python 3.10 -m unittest discover -s packaging/python/tests -v
      - name: Build native bundle
        run: |
          New-Item -ItemType Directory -Path .\dist\wheel, .\dist\wheel-repro | Out-Null
          .\scripts\New-WindowsPackage.ps1 `
            -OutputDirectory .\dist\wheel `
            -Version $env:WHEEL_VERSION `
            -Commit $env:WHEEL_COMMIT `
            -SourceDateEpoch 315532800
      - name: Verify reproducible wheel builds across Python versions
        run: |
          $archive = (Resolve-Path -LiteralPath ".\dist\wheel\multi-dap-$env:WHEEL_VERSION-windows-amd64.zip").Path
          uv build --wheel .\packaging\python --offline --no-python-downloads --python 3.10 --out-dir .\dist\wheel -C "archive=$archive"
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.10 wheel build failed.' }
          uv build --wheel .\packaging\python --offline --no-python-downloads --python 3.12 --out-dir .\dist\wheel-repro -C "archive=$archive"
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.12 wheel build failed.' }
          $first = @(Get-ChildItem -LiteralPath .\dist\wheel -Filter '*.whl' -File)
          $second = @(Get-ChildItem -LiteralPath .\dist\wheel-repro -Filter '*.whl' -File)
          if ($first.Count -ne 1 -or $second.Count -ne 1 -or $first[0].Name -cne $second[0].Name) {
            throw 'Each build must produce exactly one identically named wheel.'
          }
          $firstHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $first[0].FullName).Hash
          $secondHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $second[0].FullName).Hash
          if ($firstHash -cne $secondHash) { throw 'Wheel builds are not byte-identical.' }
          "WHEEL_PATH=$($first[0].FullName)" >> $env:GITHUB_ENV
          Write-Output "Reproducible wheel SHA256: $firstHash"
      - name: Verify offline install, CLI, reinstall and uninstall
        run: |
          foreach ($pythonVersion in @('3.10', '3.12')) {
            uv run --offline --no-python-downloads --no-project --python $pythonVersion .\packaging\python\tests\smoke_install.py --wheel $env:WHEEL_PATH
            if ($LASTEXITCODE -ne 0) { throw "Installed wheel smoke failed on Python $pythonVersion." }
          }
      - name: Verify wheel checks did not modify source
        run: |
          $changes = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect the checked-out source state.' }
          if ($changes.Count -ne 0) {
            $changes
            throw 'Wheel checks modified tracked or unignored source files.'
          }

  package:
    name: Windows release candidate
    needs: [go, python-host, vscode, zed, docs, go-vulnerability-audit, workflow-policy, wheel]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          enable-cache: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prepare offline release dependencies
        shell: pwsh
        run: |
          go mod download
          uv python install 3.12
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-wasip2
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain preparation failed.' }
          cargo +1.95.0 fetch --locked --manifest-path editors/zed/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Zed dependency preparation failed.' }
      - name: Run full release acceptance
        shell: pwsh
        run: |
          .\scripts\Invoke-WindowsReleaseAcceptance.ps1 `
            -Mode Full `
            -Version "0.0.0-ci.${{ github.run_number }}" `
            -Commit "${{ github.sha }}" `
            -SourceDateEpoch 315532800
      - name: Verify release acceptance did not modify source
        shell: pwsh
        run: |
          $changes = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect the checked-out source state.'
          }
          if ($changes.Count -ne 0) {
            $changes
            throw 'Release acceptance modified tracked or unignored source files.'
          }
      - name: Build candidate archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\dist | Out-Null
          .\scripts\New-WindowsPackage.ps1 `
            -OutputDirectory .\dist `
            -Version "0.0.0-ci.${{ github.run_number }}" `
            -Commit "${{ github.sha }}" `
            -SourceDateEpoch 315532800
